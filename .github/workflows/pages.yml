# Publica la carpeta app/ en GitHub Pages cuando se une un cambio a main.
name: Publicar la app

on:
  push:
    branches: [main]
    paths: ['app/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Marca la versión: ?v=<commit> en el CSS y en cada import de JS (así el navegador no usa archivos viejos guardados)
      # y version.json, que la app consulta para avisar que hay una versión nueva.
      - name: Marcar la versión
        run: |
          V="${GITHUB_SHA::7}"
          echo "{\"version\": \"$V\"}" > app/version.json
          sed -i "s/'desarrollo'/'$V'/" app/js/version.js
          sed -i -E "s#(from '\./[a-z_]+\.js)'#\1?v=$V'#g" app/js/*.js
          sed -i -E "s#(src=\"js/app\.js)\"#\1?v=$V\"#; s#(href=\"css/app\.css)\"#\1?v=$V\"#" app/index.html
          grep -c "?v=$V" app/index.html app/js/*.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v4
