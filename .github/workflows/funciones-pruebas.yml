# Publica las funciones de Supabase de la rama factura-electronica en el proyecto DE PRUEBAS ("Kioscos pruebas FE"),
# nunca en producción. Usa SUPABASE_ACCESS_TOKEN_PRUEBAS (token limitado al proyecto de pruebas, solo Edge Functions
# lectura y escritura; vence: al renovarlo se reemplaza el secreto) y la variable SUPABASE_REF_PRUEBAS.
# El control de abajo sigue igual: corta si el proyecto es el de producción.
# Los secretos de las funciones de pruebas se cargan en ese proyecto (Edge Functions → Secrets), no acá.
name: Publicar las funciones de pruebas

on:
  push:
    branches: [factura-electronica]
    paths: ['supabase/functions/**', 'supabase/config.toml', '.github/workflows/funciones-pruebas.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funciones-pruebas
  cancel-in-progress: false

jobs:
  publicar:
    if: github.ref == 'refs/heads/factura-electronica'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN_PRUEBAS }}
      REF_PRUEBAS: ${{ vars.SUPABASE_REF_PRUEBAS }}
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que sea el proyecto de pruebas
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN_PRUEBAS."; exit 1; fi
          if [ -z "$REF_PRUEBAS" ]; then echo "::error::Falta la variable SUPABASE_REF_PRUEBAS."; exit 1; fi
          if [ "$REF_PRUEBAS" = "jmktvtbyeifrminlrhpa" ]; then echo "::error::SUPABASE_REF_PRUEBAS es el proyecto de producción."; exit 1; fi
          echo "Proyecto de pruebas: $REF_PRUEBAS"

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      - name: Publicar
        run: supabase functions deploy --project-ref "$REF_PRUEBAS" --use-api
