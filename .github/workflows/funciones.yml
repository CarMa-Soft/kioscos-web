# Publica las funciones de Supabase (supabase/functions) cuando cambian en main.
# Usa el secreto SUPABASE_ACCESS_TOKEN (token personal de Supabase: Account → Access Tokens). Nunca se escribe en ningún archivo.
# La clave de IA no pasa por acá: está en los secretos de las funciones, en Supabase (Edge Functions → Secrets).
name: Publicar las funciones

on:
  push:
    branches: [main]
    paths: ['supabase/functions/**', 'supabase/config.toml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: funciones
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Revisar que esté el secreto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Falta el secreto SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: supabase/setup-cli@v3
        with:
          version: 2.117.0

      - name: Publicar
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy leer-factura --project-ref jmktvtbyeifrminlrhpa --use-api
