# Pruebas de la base en cada PR: aplica las migraciones que todavía no están en la base y corre tests/*.sql,
# todo dentro de una transacción que se deshace al final. No deja nada en la base.
# Corre en todos los PR (no solo los que tocan la base): la regla de main la exige para unir.
name: Pruebas de la base

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pruebas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probar:
    runs-on: ubuntu-latest
    # Los PR desde forks y los de Dependabot no reciben el secreto: ahí se saltea (para la regla de main, saltear cuenta
    # como aprobado). Dependabot solo actualiza las acciones de GitHub, no toca la base.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    steps:
      - uses: actions/checkout@v7

      - name: Revisar que esté el secreto
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Falta el secreto SUPABASE_DB_URL."; exit 1; fi

      - name: Cliente de Postgres
        run: command -v psql || (sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client)

      - name: Armar el script de prueba
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          aplicadas=$(psql "$SUPABASE_DB_URL" -Atc "select version from supabase_migrations.schema_migrations" || true)
          {
            echo '\set ON_ERROR_STOP on'
            echo 'begin;'
            for f in supabase/migrations/*.sql; do
              v=$(basename "$f" | cut -d_ -f1)
              if ! grep -qx "$v" <<< "$aplicadas"; then echo "\\echo == Migración nueva: $f"; echo "\\i $f"; fi
            done
            for t in tests/*.sql; do echo "\\echo ==== $t"; echo "\\i $t"; done
            echo 'rollback;'
          } > "$RUNNER_TEMP/pruebas.sql"
          cat "$RUNNER_TEMP/pruebas.sql"

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Revisar las funciones de Supabase
        run: for f in supabase/functions/*/index.ts; do deno check "$f"; done

      - name: Correr las pruebas
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/pruebas.sql"
